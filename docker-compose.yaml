  #   build:
  #     context: .
  #     dockerfile: Dockerfile.coolify
  #     target: print
  #   restart: unless-stopped
  #   depends_on:
  #     account:
  #       condition: service_started
  #   environment:
  #     SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
  #     REGION: cockroach
  #     QUEUE_CONFIG: redpanda:9092
