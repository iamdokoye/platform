# ================================================================
# Promaly Platform — Coolify / self-hosted Docker Compose
#
# Builds all Node.js services from source using Dockerfile.coolify.
# Rust services (hulylake, hulypulse) build from their own Dockerfiles.
# Infrastructure services use stable upstream images.
#
# Copy .env.coolify.example to .env and set at minimum:
#   PUBLIC_URL, SERVER_SECRET, TRANSACTOR_WS_URL, COLLABORATOR_WS_URL
# ================================================================

services:

  # ════════════════════════════════════════════════════════════
  # Infrastructure
  # ════════════════════════════════════════════════════════════

  cockroach:
    image: cockroachdb/cockroach:latest-v24.3
    restart: unless-stopped
    command: start-single-node --insecure
    volumes:
      - cockroach_data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${COCKROACH_DB_PORT:-26257}:26257"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
      - --memory 512M
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  elastic:
    image: elasticsearch:7.14.2
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms256m -Xmx450m
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 20s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1024m

  redis:
    image: redis:8.0.2-alpine3.21
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════
  # Core application services (built from source)
  # ════════════════════════════════════════════════════════════

  stats:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      target: stats
    restart: unless-stopped
    environment:
      SERVER_SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      PORT: 4900
    ports:
      - "${STATS_PORT:-4900}:4900"

  account:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      target: account
    restart: unless-stopped
    depends_on:
      cockroach:
        condition: service_healthy
      stats:
        condition: service_started
    environment:
      SERVER_SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      ACCOUNT_PORT: 3000
      DB_URL: postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      QUEUE_CONFIG: redpanda:9092
      STORAGE_CONFIG: datalake|http://datalake:4030
      ACCOUNTS_URL: http://account:3000
      TRANSACTOR_URL: ${TRANSACTOR_WS_URL:-ws://transactor:3332};;cockroach,
      STATS_URL: http://stats:4900
      FRONT_URL: ${PUBLIC_URL:-http://localhost:8087}
      REGION_INFO: cockroach|CockroachDB
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin}
      WORKSPACE_LIMIT_PER_USER: 10000
      LAST_NAME_FIRST: "true"
      BRANDING_PATH: /var/cfg/branding.json
      MAIL_URL: ${MAIL_URL:-}
    volumes:
      - ./dev/branding.json:/var/cfg/branding.json:ro
    ports:
      - "${ACCOUNT_PORT:-3000}:3000"

  transactor:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      target: transactor
    restart: unless-stopped
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      account:
        condition: service_started
      stats:
        condition: service_started
    environment:
      SERVER_SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      SERVER_PORT: 3332
      REGION: cockroach
      DB_URL: postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      QUEUE_CONFIG: redpanda:9092
      STORAGE_CONFIG: datalake|http://datalake:4030
      ACCOUNTS_URL: http://account:3000
      FRONT_URL: ${PUBLIC_URL:-http://localhost:8087}
      STATS_URL: http://stats:4900
      FULLTEXT_URL: http://fulltext:4702
      FILES_URL: ${PUBLIC_URL:-http://localhost:8087}/files/:workspace/:blobId/:filename
      ENABLE_COMPRESSION: "true"
      METRICS_CONSOLE: "false"
      METRICS_FILE: metrics.txt
      LAST_NAME_FIRST: "true"
      BRANDING_PATH: /var/cfg/branding.json
      COMMUNICATION_API_ENABLED: "true"
      RATE_LIMIT_MAX: 250
      RATE_LIMIT_WINDOW: 30000
      HYLYLAKE_URL: http://hulylake:8096
    volumes:
      - ./dev/branding.json:/var/cfg/branding.json:ro
    ports:
      - "${TRANSACTOR_PORT:-3332}:3332"

  workspace:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      target: workspace
    restart: unless-stopped
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      account:
        condition: service_started
      stats:
        condition: service_started
    environment:
      SERVER_SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      WS_OPERATION: all+backup
      REGION: cockroach
      DB_URL: postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      ACCOUNTS_DB_URL: postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      QUEUE_CONFIG: redpanda:9092
      STORAGE_CONFIG: datalake|http://datalake:4030
      ACCOUNTS_URL: http://account:3000
      STATS_URL: http://stats:4900
      BRANDING_PATH: /var/cfg/branding.json
      BACKUP_STORAGE: "minio|minio?accessKey=${MINIO_ACCESS_KEY:-minioadmin}&secretKey=${MINIO_SECRET_KEY:-minioadmin}"
      BACKUP_BUCKET: ${BACKUP_BUCKET_NAME:-huly-backups}
      MAIL_URL: ${MAIL_URL:-}
    volumes:
      - ./dev/branding.json:/var/cfg/branding.json:ro

  collaborator:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      target: collaborator
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      account:
        condition: service_started
      stats:
        condition: service_started
    environment:
      SERVER_SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      COLLABORATOR_PORT: 3078
      ACCOUNTS_URL: http://account:3000
      STORAGE_CONFIG: datalake|http://datalake:4030
      STATS_URL: http://stats:4900
    ports:
      - "${COLLABORATOR_PORT:-3078}:3078"

  front:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      target: front
    restart: unless-stopped
    depends_on:
      account:
        condition: service_started
      stats:
        condition: service_started
    environment:
      SERVER_SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      SERVER_PORT: 8080
      ACCOUNTS_URL: http://account:3000
      STATS_URL: http://stats:4900
      UPLOAD_URL: /files
      FILES_URL: ${PUBLIC_URL:-http://localhost:8087}/files/:workspace/:blobId/:filename
      DATALAKE_URL: ${PUBLIC_URL:-http://localhost:8087}
      PREVIEW_URL: ${PREVIEW_URL:-http://localhost:4040}
      COLLABORATOR_URL: ${COLLABORATOR_WS_URL:-ws://localhost:3078}
      REKONI_URL: http://rekoni:4004
      LINK_PREVIEW_URL: ${LINK_PREVIEW_URL:-http://localhost:4041}
      EXPORT_URL: http://export-svc:4009
      BACKUP_URL: http://backup-api:4039/api/backup
      HULYLAKE_URL: ${HULYLAKE_URL:-http://localhost:8096}
      PULSE_URL: ${PULSE_URL:-ws://localhost:8099/ws}
      STREAM_URL: ${STREAM_URL:-}
      PRINT_URL: ${PRINT_URL:-}
      SIGN_URL: ${SIGN_URL:-}
      GITHUB_URL: ${GITHUB_URL:-}
      GMAIL_URL: ${GMAIL_URL:-}
      CALENDAR_URL: ${CALENDAR_URL:-}
      TELEGRAM_URL: ${TELEGRAM_URL:-}
      PAYMENT_URL: ${PAYMENT_URL:-}
      DESKTOP_UPDATES_URL: https://dist.huly.io
      DESKTOP_UPDATES_CHANNEL: dev
      BRANDING_URL: ${PUBLIC_URL:-http://localhost:8087}/branding.json
      COMMUNICATION_API_ENABLED: "true"
      DISABLED_FEATURES: auto-translate,mailboxes
    ports:
      - "${FRONT_PORT:-8087}:8080"

  # ════════════════════════════════════════════════════════════
  # Data & search services
  # ════════════════════════════════════════════════════════════

  datalake:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      target: datalake
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      cockroach:
        condition: service_healthy
      account:
        condition: service_started
      stats:
        condition: service_started
    environment:
      SERVER_SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      PORT: 4030
      REGION: cockroach
      DB_URL: postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      QUEUE_CONFIG: redpanda:9092
      ACCOUNTS_URL: http://account:3000
      STATS_URL: http://stats:4900
      BUCKETS: "blobs,eu|http://minio:9000?accessKey=${MINIO_ACCESS_KEY:-minioadmin}&secretKey=${MINIO_SECRET_KEY:-minioadmin}"
    ports:
      - "${DATALAKE_PORT:-4030}:4030"

  hulylake:
    build:
      context: foundations/hulylake
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      cockroach:
        condition: service_healthy
    environment:
      HULY_TOKEN_SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      HULY_DB_CONNECTION: postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_REGION: local
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${HULYLAKE_PORT:-8096}:8096"

  hulykvs:
    image: hardcoreeng/hulykvs
    restart: unless-stopped
    depends_on:
      cockroach:
        condition: service_healthy
    environment:
      HULY_DB_CONNECTION: postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      HULY_TOKEN_SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
    ports:
      - "${HULYKVS_PORT:-8094}:8094"

  hulypulse:
    build:
      context: foundations/hulypulse
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    environment:
      HULY_REDIS_URLS: redis://redis:6379
      HULY_BIND_PORT: 8099
    ports:
      - "${HULYPULSE_PORT:-8099}:8099"

  hulygun:
    image: hardcoreeng/hulygun
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      account:
        condition: service_started
    environment:
      HULY_LOG: info
      HULY_KAFKA_BOOTSTRAP: redpanda:9092
      HULY_TOKEN_SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      HULY_ACCOUNT_SERVICE: http://account:3000

  fulltext:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      target: fulltext
    restart: unless-stopped
    depends_on:
      elastic:
        condition: service_healthy
      cockroach:
        condition: service_healthy
      account:
        condition: service_started
      rekoni:
        condition: service_started
      stats:
        condition: service_started
    environment:
      SERVER_SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      PORT: 4702
      REGION: cockroach
      DB_URL: postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      QUEUE_CONFIG: redpanda:9092
      STORAGE_CONFIG: datalake|http://datalake:4030
      ACCOUNTS_URL: http://account:3000
      STATS_URL: http://stats:4900
      FULLTEXT_DB_URL: http://elastic:9200
      ELASTIC_INDEX_NAME: huly_index
      REKONI_URL: http://rekoni:4004
      HULYLAKE_URL: http://hulylake:8096
      COMMUNICATION_API_ENABLED: "true"
    ports:
      - "${FULLTEXT_PORT:-4702}:4702"

  # ════════════════════════════════════════════════════════════
  # Media & preview services
  # ════════════════════════════════════════════════════════════

  rekoni:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      target: rekoni
    restart: unless-stopped
    environment:
      STATS_URL: http://stats:4900
    ports:
      - "${REKONI_PORT:-4004}:4004"

  preview:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      target: preview
    restart: unless-stopped
    environment:
      SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      STORAGE_CONFIG: datalake|http://datalake:4030
      CACHE_PATH: /data/cache
    volumes:
      - preview_cache:/data/cache
    ports:
      - "${PREVIEW_PORT:-4040}:4040"

  link-preview:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      target: link-preview
    restart: unless-stopped
    environment:
      SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      PORT: 4041
    ports:
      - "${LINK_PREVIEW_PORT:-4041}:4041"

  # ════════════════════════════════════════════════════════════
  # Export / import / backup
  # ════════════════════════════════════════════════════════════

  export-svc:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      target: export-svc
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      account:
        condition: service_started
      stats:
        condition: service_started
    environment:
      SERVER_SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      PORT: 4009
      SERVICE_ID: export-service
      DB_URL: postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      STORAGE_CONFIG: datalake|http://datalake:4030
      ACCOUNTS_URL: http://account:3000
      STATS_URL: http://stats:4900
    ports:
      - "${EXPORT_PORT:-4009}:4009"

  backup:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      target: backup
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      cockroach:
        condition: service_healthy
      account:
        condition: service_started
      stats:
        condition: service_started
    environment:
      SERVER_SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      REGION: cockroach
      DB_URL: postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      ACCOUNTS_DB_URL: postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      QUEUE_CONFIG: redpanda:9092
      ACCOUNTS_URL: http://account:3000
      STATS_URL: http://stats:4900
      STORAGE: "minio|minio?accessKey=${MINIO_ACCESS_KEY:-minioadmin}&secretKey=${MINIO_SECRET_KEY:-minioadmin}"
      WORKSPACE_STORAGE: datalake|http://datalake:4030
      BUCKET_NAME: ${BACKUP_BUCKET_NAME:-huly-backups}
      INTERVAL: 3600

  backup-api:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      target: backup-api
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      account:
        condition: service_started
      stats:
        condition: service_started
    environment:
      SERVER_SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      PORT: 4039
      ACCOUNTS_URL: http://account:3000
      STATS_URL: http://stats:4900
      STORAGE: "minio|minio?accessKey=${MINIO_ACCESS_KEY:-minioadmin}&secretKey=${MINIO_SECRET_KEY:-minioadmin}"
      BUCKET_NAME: ${BACKUP_BUCKET_NAME:-huly-backups}
    ports:
      - "${BACKUP_API_PORT:-4039}:4039"

  # ════════════════════════════════════════════════════════════
  # Analytics & event processing
  # ════════════════════════════════════════════════════════════

  analytics:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      target: analytics
    restart: unless-stopped
    depends_on:
      account:
        condition: service_started
      stats:
        condition: service_started
    environment:
      SERVER_SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      PORT: 4017
      SERVICE_ID: analytics-collector-service
      ACCOUNTS_URL: http://account:3000
      STATS_URL: http://stats:4900
    ports:
      - "${ANALYTICS_PORT:-4017}:4017"

  process-svc:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      target: process-svc
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      account:
        condition: service_started
    environment:
      SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      ACCOUNTS_URL: http://account:3000
      QUEUE_CONFIG: redpanda:9092
      QUEUE_REGION: cockroach

  time-machine:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      target: time-machine
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      cockroach:
        condition: service_healthy
      account:
        condition: service_started
    environment:
      DB_URL: postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      QUEUE_CONFIG: redpanda:9092
      QUEUE_REGION: cockroach

  events-proc:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      target: events-proc
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      account:
        condition: service_started
    environment:
      SERVER_SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      SERVICE_ID: events-processor
      LOG_LEVEL: info
      ACCOUNTS_URL: http://account:3000
      QUEUE_CONFIG: redpanda:9092
      QUEUE_REGION: cockroach

  rating:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      target: rating
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      cockroach:
        condition: service_healthy
      minio:
        condition: service_healthy
      account:
        condition: service_started
      stats:
        condition: service_started
    environment:
      SERVER_SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
      REGION: cockroach
      DB_URL: postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      QUEUE_CONFIG: redpanda:9092
      STORAGE_CONFIG: datalake|http://datalake:4030
      ACCOUNTS_URL: http://account:3000
      STATS_URL: http://stats:4900
      HYLYLAKE_URL: http://hulylake:8096
      COMMUNICATION_API_ENABLED: "true"

  # ════════════════════════════════════════════════════════════
