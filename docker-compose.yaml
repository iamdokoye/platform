  #   build:
  #     context: foundations/stream
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   environment:
  #     STREAM_ENDPOINT_URL: datalake://datalake:4030
  #     STREAM_INSECURE: "true"
  #     STREAM_SERVER_SECRET: ${SERVER_SECRET:-changeme-use-a-long-random-string}
